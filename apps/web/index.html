<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Forma</title>
        <meta name="description" content="Your exercises, routines, and progress. A calmer way to train." />

        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

        <!--
            The two faces every page paints with. Without these the browser only discovers them
            after it has downloaded and parsed the stylesheet, which is itself render-blocking.
            The latin-ext subsets are deliberately not preloaded: they are only fetched when a page
            actually contains characters in that range.
        -->
        <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

        <link rel="canonical" href="%SITE_ORIGIN%/" />

        <meta property="og:title" content="Forma" />
        <meta property="og:description" content="Your exercises, routines, and progress. A calmer way to train." />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Forma" />
        <meta property="og:url" content="%SITE_ORIGIN%/" />
        <meta property="og:image" content="%SITE_ORIGIN%/og-preview.png" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Forma — your exercises, routines, and progress." />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Forma" />
        <meta name="twitter:description" content="Your exercises, routines, and progress. A calmer way to train." />
        <meta name="twitter:image" content="%SITE_ORIGIN%/og-preview.png" />
        <meta name="twitter:image:alt" content="Forma — your exercises, routines, and progress." />

        <meta name="theme-color" content="#2b5945" />
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
