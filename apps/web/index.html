<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Forma — Your space to train</title>
        <meta name="description" content="Your exercises, routines, and progress. A calmer way to train." />

        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

        <!--
            The two faces every page paints with. Without these the browser only discovers them
            after it has downloaded and parsed the stylesheet, which is itself render-blocking.
            The latin-ext subsets are deliberately not preloaded: they are only fetched when a page
            actually contains characters in that range.
        -->
        <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

        <meta property="og:title" content="Forma" />
        <meta property="og:description" content="Your exercises, routines, and progress. A calmer way to train." />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Forma" />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Forma" />
        <meta name="twitter:description" content="Your exercises, routines, and progress. A calmer way to train." />
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
