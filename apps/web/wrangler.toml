name = "workout-tracker-app-web"
compatibility_date = "2026-08-16"
pages_build_output_dir = "dist"

# Read at request time by functions/api/[[path]].ts, not baked into the SPA bundle.
# Not a secret — it is the public URL of the deployed API.
[vars]
API_ORIGIN = "https://api-production-ac4e.up.railway.app"

# Read by the Vite build (see vite.config.ts) to make the canonical link and social preview meta
# tags absolute. Not a secret — it is this deployment's own public origin.
VITE_SITE_URL = "https://workout-tracker-app-web.pages.dev"
