name: Seed exercises

# Publishes content/exercises into the deployed catalog, so changing exercise content is a merge
# rather than an operator running apps/admin against production from a laptop.
on:
  push:
    branches: [main]
    paths:
      - 'content/exercises/**'
      - '.github/workflows/seed-exercises.yml'
  workflow_dispatch:

concurrency:
  group: seed-exercises
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter=@app/admin...

      # Better Auth writes naive timestamps, so every process touching its tables agrees on UTC -
      # the CLI boots @app/auth, so this job runs under the same rule as the API's image.
      - name: Publish content/exercises
        working-directory: apps/admin
        env:
          TZ: UTC
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_FORCE_PATH_STYLE: ${{ vars.S3_FORCE_PATH_STYLE || 'false' }}
        run: pnpm start seed-exercises
