name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded PR run tells nobody anything, so let a new push cancel it. Pushes to main are left
# alone: their runs gate the deploys below.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Turbo replays the cached result of any task whose inputs are unchanged, so a web-only
      # change does not re-run the backend suites.
      TURBO_CACHE_DIR: .turbo
      # The runner is thrown away after the job, so there is nothing for Ryuk to reap and no
      # reason to start it alongside every test container.
      TESTCONTAINERS_RYUK_DISABLED: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      # Formatting is the cheapest thing that can fail, so it fails before the long steps rather
      # than after them.
      - run: pnpm format
      - run: git diff --exit-code

      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  # Build only, on PRs, so a broken Dockerfile fails here rather than after merge when Railway
  # tries to deploy it. Nothing is pushed, tagged or run: Railway builds and probes readiness
  # itself, and a failed probe stops the deploy.
  images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, mcp]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build apps/${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: app-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Publishes apps/web to Cloudflare Pages on every merge to main, gated on the checks above.
  # Railway holds its own API and MCP deploys behind the same check suite, so nothing in the
  # production topology moves on a red main.
  deploy-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # PostHog is read through import.meta.env, so it is baked in here rather than supplied at
      # request time like API_ORIGIN. Unset secrets simply build without analytics.
      - name: Build apps/web
        run: pnpm --filter @app/web build
        env:
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}

      # The pinned wrangler from the lockfile, not a third-party action, so the deploy runs the
      # same version a maintainer runs by hand. Project name and output directory come from
      # apps/web/wrangler.toml.
      - name: Deploy to Cloudflare Pages
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy --branch=main
