# Local development services. Start them before `pnpm dev`.
#
# Data lives in named volumes rather than host bind mounts, so `docker compose down -v` is the one
# command that resets local state and nothing outside the volume is ever touched.

services:
    db:
        image: postgres:17
        container_name: app-postgres
        restart: unless-stopped
        # pg_stat_statements has to be in shared_preload_libraries, which is a server-start setting:
        # `ALTER SYSTEM` plus a restart works until something recreates the container, at which point
        # the setting is silently gone. A flag here cannot drift from a file nobody reads.
        command: postgres -c shared_preload_libraries=pg_stat_statements
        volumes:
            - postgres-data:/var/lib/postgresql/data
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: app
            PGOPTIONS: '--client-min-messages=warning'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        container_name: app-redis
        restart: unless-stopped
        command: redis-server --save 60 1
        volumes:
            - redis-data:/data
        ports:
            - '6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

    # S3-compatible object storage. Only needed if your app actually stores files - `S3_BUCKET`
    # being unset is what turns storage off in `apps/api`.
    minio:
        image: minio/minio:latest
        container_name: app-minio
        restart: unless-stopped
        command: server /data --console-address ':9001'
        volumes:
            - minio-data:/data
        ports:
            - '9000:9000'
            - '9001:9001'
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        healthcheck:
            test: ['CMD', 'mc', 'ready', 'local']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres-data:
    redis-data:
    minio-data:
