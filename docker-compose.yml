# Local development services. Start them before `pnpm dev`.
#
# Data lives in bind mounts outside the repo, so neither `docker compose down -v` nor a git purge
# can wipe it. `DATA_DIR` comes from the root `.env` (see `.env.example`); delete that directory to
# reset local state.

name: wt-app

services:
    db:
        image: postgres:17
        container_name: wt-app-postgres
        restart: unless-stopped
        # pg_stat_statements has to be in shared_preload_libraries, which is a server-start setting:
        # `ALTER SYSTEM` plus a restart works until something recreates the container, at which point
        # the setting is silently gone. A flag here cannot drift from a file nobody reads.
        command: postgres -c shared_preload_libraries=pg_stat_statements
        volumes:
            - ${DATA_DIR:?set DATA_DIR in the root .env}/postgres:/var/lib/postgresql/data
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: app
            PGOPTIONS: '--client-min-messages=warning'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            timeout: 5s
            retries: 10

    # Redis not required in this project
    # redis:
    #     image: redis:7-alpine
    #     container_name: wt-app-redis
    #     restart: unless-stopped
    #     command: redis-server --save 60 1
    #     volumes:
    #         - ${DATA_DIR:?set DATA_DIR in the root .env}/redis:/data
    #     ports:
    #         - '6379:6379'
    #     healthcheck:
    #         test: ['CMD', 'redis-cli', 'ping']
    #         interval: 5s
    #         timeout: 5s
    #         retries: 10

    # S3-compatible object storage. Exercise guide images live here, so `apps/api` refuses to boot
    # without `S3_BUCKET` and credentials.
    minio:
        image: minio/minio:latest
        container_name: wt-app-minio
        restart: unless-stopped
        command: server /data --console-address ':9001'
        volumes:
            - ${DATA_DIR:?set DATA_DIR in the root .env}/minio:/data
        ports:
            - '9000:9000'
            - '9001:9001'
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        healthcheck:
            test: ['CMD', 'mc', 'ready', 'local']
            interval: 5s
            timeout: 5s
            retries: 10

    # One-shot: creates the bucket `apps/api` expects (`S3_BUCKET`) and opens anonymous read on its
    # `catalog/` prefix, which stands in for the production CDN — the browser loads catalog images
    # straight from `http://localhost:9000/wt-app/catalog/...` (`CATALOG_IMAGE_BASE_URL`). The rest
    # of the bucket stays private. MinIO does not auto-create buckets, so a fresh DATA_DIR would
    # otherwise boot the API against a 404.
    minio-init:
        image: minio/mc:latest
        container_name: wt-app-minio-init
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            sh -c "
                mc alias set local http://minio:9000 minioadmin minioadmin &&
                mc mb --ignore-existing local/wt-app &&
                mc anonymous set download local/wt-app/catalog
            "
